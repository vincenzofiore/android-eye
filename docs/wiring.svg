<text x="90" y="1123" font-size="12" fill="#4a4a4a" text-anchor="start" font-weight="normal">&#8226; D9 and D10 lose PWM while the Servo library is linked: expected, not a fault.</text>
<text x="90" y="1140" font-size="12" fill="#4a4a4a" text-anchor="start" font-weight="normal">&#8226; On the bench the SG90 runs from the board 5 V; on site give it its own 5 V supply and tie the grounds together.</text>
<text x="90" y="1157" font-size="12" fill="#4a4a4a" text-anchor="start" font-weight="normal">&#8226; ECHO outputs 5 V: keep the board at 5 V logic, no level shifter needed. The HC-SR04 wants at least 10 &#181;s on TRIG.</text>
<text x="90" y="1174" font-size="12" fill="#4a4a4a" text-anchor="start" font-weight="normal">&#8226; D4 stays unused until the soft-latch circuit is installed: leave CON_LATCH at 0.</text>
