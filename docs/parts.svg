<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
<rect width="210" height="297" fill="#ffffff"/>
<text x="14" y="12" font-size="6" fill="#161616" text-anchor="start" font-weight="bold" letter-spacing="0.2">ANDROID EYE &#183; SMALL PARTS, 1:1</text>
<text x="14" y="17.5" font-size="3.8" fill="#5f6b73" text-anchor="start" font-weight="normal">print at 100 %, no fit to page &#183; every outline below is the real size</text>
<path d="M 14 20 L 196 20" stroke="#c9c3b6" stroke-width="0.4"/>
<text x="16" y="30" font-size="4.6" fill="#161616" text-anchor="start" font-weight="bold">EAR</text>
<text x="16" y="34.5" font-size="3.4" fill="#6b6b6b" text-anchor="start" font-weight="normal">18 mm plywood, one piece</text>
<path d="M 24.00 40.00 C 21.00 48.00 22.00 60.00 26.00 72.00 C 30.00 84.00 34.00 92.00 40.00 96.00 C 46.00 99.00 50.00 96.00 49.00 90.00 C 47.00 84.00 42.00 80.00 40.00 74.00 C 38.00 67.00 41.00 60.00 46.00 55.00 C 49.00 51.00 49.00 45.00 44.00 42.00 C 37.00 38.00 28.00 38.00 24.00 40.00" fill="#e8dcc4" stroke="#5a4a30" stroke-width="0.5"/>
<circle cx="33" cy="59" r="8" fill="#ffffff" stroke="#3d3d3d" stroke-width="0.4"/>
<circle cx="33" cy="77" r="8" fill="#ffffff" stroke="#3d3d3d" stroke-width="0.4"/>
<text x="20" y="106" font-size="3.4" fill="#4a4a4a" text-anchor="start" font-weight="normal">30 &#215; 60 &#183; the two &#216;16 holes are the transducers</text>
<path d="M 20 110 L 50 110" stroke="#2b6cb0" stroke-width="0.3"/>
<text x="35" y="113.5" font-size="3.6" fill="#2b6cb0" text-anchor="middle" font-weight="normal">30</text>
<text x="66" y="30" font-size="4.6" fill="#161616" text-anchor="start" font-weight="bold">HALF NOSE</text>
<text x="66" y="34.5" font-size="3.4" fill="#6b6b6b" text-anchor="start" font-weight="normal">18 mm plywood, screwed on the cut edge</text>
<path d="M 66.00 40.00 L 94.00 45.00 L 94.00 59.00 L 66.00 66.00" fill="#e8dcc4" stroke="#5a4a30" stroke-width="0.5"/>
<text x="66" y="74" font-size="3.4" fill="#4a4a4a" text-anchor="start" font-weight="normal">side view: 28 mm out of the face, 26 mm at the base</text>
<path d="M 66.00 82.00 L 94.00 82.00 L 94.00 94.00 L 66.00 94.00" fill="#e8dcc4" stroke="#5a4a30" stroke-width="0.5"/>
<text x="66" y="100" font-size="3.4" fill="#4a4a4a" text-anchor="start" font-weight="normal">plan: 12 mm wide</text>
<text x="112" y="30" font-size="4.6" fill="#161616" text-anchor="start" font-weight="bold">BROW</text>
<path d="M 112.00 40.00 L 172.00 47.00 L 172.00 59.00 L 112.00 52.00" fill="#e8dcc4" stroke="#5a4a30" stroke-width="0.5"/>
<text x="112" y="68" font-size="3.4" fill="#4a4a4a" text-anchor="start" font-weight="normal">60 long, 12 thick, 7 mm of slope</text>
<text x="112" y="84" font-size="4.6" fill="#161616" text-anchor="start" font-weight="bold">CHIN</text>
<path d="M 112.00 92.00 L 139.00 92.00 L 139.00 118.00 L 112.00 118.00" fill="#e8dcc4" stroke="#5a4a30" stroke-width="0.5"/>
<text x="112" y="124" font-size="3.4" fill="#4a4a4a" text-anchor="start" font-weight="normal">27 &#215; 26 &#215; 18 block</text>
<text x="14" y="140" font-size="4.6" fill="#161616" text-anchor="start" font-weight="bold" letter-spacing="0.2">WHAT HAS NO TEMPLATE, AND WHY</text>
<text x="14" y="146" font-size="3.8" fill="#5f6b73" text-anchor="start" font-weight="normal">&#8226;</text>
<text x="18" y="146.0" font-size="3.6" fill="#4a4a4a" text-anchor="start" font-weight="normal">The pseudo mouth is a recess, not a piece: set the router to 4 mm and take out a slot 90 mm</text>
<text x="18" y="150.4" font-size="3.6" fill="#4a4a4a" text-anchor="start" font-weight="normal">long, 14 mm tall, 4 mm deep. The shadow does the rest.</text>
<text x="14" y="157.4" font-size="3.8" fill="#5f6b73" text-anchor="start" font-weight="normal">&#8226;</text>
<text x="18" y="157.4" font-size="3.6" fill="#4a4a4a" text-anchor="start" font-weight="normal">The eyelid cannot be templated flat: it is a shell that follows the 17.5 mm radius. Either</text>
<text x="18" y="161.8" font-size="3.6" fill="#4a4a4a" text-anchor="start" font-weight="normal">cut it from a 35 mm plastic ball (a table-tennis ball is 40 and can be sanded down), or</text>
<text x="18" y="166.20000000000002" font-size="3.6" fill="#4a4a4a" text-anchor="start" font-weight="normal">press 1.5 mm plywood over a 35 mm ball and let it dry in shape.</text>
<text x="14" y="173.20000000000002" font-size="3.8" fill="#5f6b73" text-anchor="start" font-weight="normal">&#8226;</text>
<text x="18" y="173.20000000000002" font-size="3.6" fill="#4a4a4a" text-anchor="start" font-weight="normal">The panel outline is on the other sheets: template.svg for a plotter, template-a4-p1.svg and</text>
<text x="18" y="177.60000000000002" font-size="3.6" fill="#4a4a4a" text-anchor="start" font-weight="normal">-p2.svg for a normal printer.</text>
<text x="14" y="184.60000000000002" font-size="3.8" fill="#5f6b73" text-anchor="start" font-weight="normal">&#8226;</text>
<text x="18" y="184.60000000000002" font-size="3.6" fill="#4a4a4a" text-anchor="start" font-weight="normal">The eye ring is turned or cut from 12 mm plywood, &#216;46 outside, &#216;40 inside: no</text>
<text x="18" y="189.00000000000003" font-size="3.6" fill="#4a4a4a" text-anchor="start" font-weight="normal">template needed, a hole saw does both.</text>
<path d="M 14 283 L 114 283" stroke="#161616" stroke-width="0.5"/>
<path d="M 14 283 L 14 278.5" stroke="#161616" stroke-width="0.35"/>
<path d="M 24 283 L 24 280.5" stroke="#161616" stroke-width="0.35"/>
<path d="M 34 283 L 34 280.5" stroke="#161616" stroke-width="0.35"/>
<path d="M 44 283 L 44 280.5" stroke="#161616" stroke-width="0.35"/>
<path d="M 54 283 L 54 280.5" stroke="#161616" stroke-width="0.35"/>
<path d="M 64 283 L 64 278.5" stroke="#161616" stroke-width="0.35"/>
<path d="M 74 283 L 74 280.5" stroke="#161616" stroke-width="0.35"/>
<path d="M 84 283 L 84 280.5" stroke="#161616" stroke-width="0.35"/>
<path d="M 94 283 L 94 280.5" stroke="#161616" stroke-width="0.35"/>
<path d="M 104 283 L 104 280.5" stroke="#161616" stroke-width="0.35"/>
<path d="M 114 283 L 114 278.5" stroke="#161616" stroke-width="0.35"/>
<text x="14" y="288" font-size="3.6" fill="#8a8a8a" text-anchor="start" font-weight="normal">100 mm: if it does not measure this, the print is scaled</text>
</svg>
