<text x="400" y="410" font-size="3.8" fill="#8a8a8a" text-anchor="start" font-weight="normal">100 mm: if the print does not measure this, it is scaled and cannot be used</text>
<text x="320" y="250.0" font-size="4.2" fill="#4a4a4a" text-anchor="start" font-weight="normal">Cut two of these in 18 mm plywood, glue them</text>
<text x="320" y="255.2" font-size="4.2" fill="#4a4a4a" text-anchor="start" font-weight="normal">face to face and cut once. Before gluing,</text>
<text x="320" y="260.4" font-size="4.2" fill="#4a4a4a" text-anchor="start" font-weight="normal">bevel 3 mm at 45&#176; along the front edge of</text>
<text x="320" y="265.6" font-size="4.2" fill="#4a4a4a" text-anchor="start" font-weight="normal">the back panel: it leaves a shadow line under</text>
<text x="320" y="270.8" font-size="4.2" fill="#4a4a4a" text-anchor="start" font-weight="normal">the front panel, all round.</text>
<text x="320" y="280.0" font-size="4.2" fill="#4a4a4a" text-anchor="start" font-weight="normal">Both panels: this same outline. Glue them</text>
<text x="320" y="285.2" font-size="4.2" fill="#4a4a4a" text-anchor="start" font-weight="normal">first, cut once, so the two silhouettes cannot</text>
<text x="320" y="290.4" font-size="4.2" fill="#4a4a4a" text-anchor="start" font-weight="normal">drift apart.</text>
<text x="320" y="299.6" font-size="4.2" fill="#4a4a4a" text-anchor="start" font-weight="normal">Blue dashed: the relief pieces, drawn at their</text>
<text x="320" y="304.8" font-size="4.2" fill="#4a4a4a" text-anchor="start" font-weight="normal">positions. They are screwed on the front face,</text>
<text x="320" y="310.0" font-size="4.2" fill="#4a4a4a" text-anchor="start" font-weight="normal">from the front, screws visible.</text>
<text x="320" y="319.20000000000005" font-size="4.2" fill="#4a4a4a" text-anchor="start" font-weight="normal">The &#216;46 socket must be drilled before the</text>
<text x="320" y="324.40000000000003" font-size="4.2" fill="#4a4a4a" text-anchor="start" font-weight="normal">front panel is mounted: the ring covers the</text>
<text x="320" y="329.6" font-size="4.2" fill="#4a4a4a" text-anchor="start" font-weight="normal">joint.</text>
