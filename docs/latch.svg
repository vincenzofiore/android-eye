<path d="M 880 520 L 938 520 L 938 620 L 950 620" fill="none" stroke="#ffffff" stroke-width="7.7" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 880 520 L 938 520 L 938 620 L 950 620" fill="none" stroke="#3a7ca5" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="942" y="618" font-size="11" fill="#3a7ca5" text-anchor="start" font-weight="bold">D8</text>
<text x="70" y="880" font-size="12" fill="#5f6b73" text-anchor="start" font-weight="normal">&#8226;</text>
<text x="86" y="880" font-size="11.5" fill="#4a4a4a" text-anchor="start" font-weight="normal">Off state: only the PIR draws, about 60 &#181;A.</text>
<text x="86" y="895" font-size="11.5" fill="#4a4a4a" text-anchor="start" font-weight="normal">That is what makes a battery pack last years.</text>
<text x="70" y="922" font-size="12" fill="#5f6b73" text-anchor="start" font-weight="normal">&#8226;</text>
<text x="86" y="922" font-size="11.5" fill="#4a4a4a" text-anchor="start" font-weight="normal">Boot: PIR OUT goes high, R3 pulls Q2's base, Q2</text>
<text x="86" y="937" font-size="11.5" fill="#4a4a4a" text-anchor="start" font-weight="normal">pulls the gate low, Q1 conducts, the board starts.</text>
<text x="70" y="964" font-size="12" fill="#5f6b73" text-anchor="start" font-weight="normal">&#8226;</text>
<text x="86" y="964" font-size="11.5" fill="#4a4a4a" text-anchor="start" font-weight="normal">Run: the sketch sets D4 high in setup(), which holds</text>
<text x="86" y="979" font-size="11.5" fill="#4a4a4a" text-anchor="start" font-weight="normal">Q2 on through R2. The PIR can now go quiet.</text>
<text x="670" y="880" font-size="12" fill="#5f6b73" text-anchor="start" font-weight="normal">&#8226;</text>
<text x="686" y="880" font-size="11.5" fill="#4a4a4a" text-anchor="start" font-weight="normal">Sleep: when the state machine reaches SLEEPING and</text>
<text x="686" y="895" font-size="11.5" fill="#4a4a4a" text-anchor="start" font-weight="normal">T_SHUTDOWN passes, D4 goes low and everything dies</text>
<text x="686" y="910" font-size="11.5" fill="#4a4a4a" text-anchor="start" font-weight="normal">but the PIR.</text>
<text x="670" y="937" font-size="12" fill="#5f6b73" text-anchor="start" font-weight="normal">&#8226;</text>
<text x="686" y="937" font-size="11.5" fill="#4a4a4a" text-anchor="start" font-weight="normal">R1 keeps the gate at the pack voltage when nothing</text>
<text x="686" y="952" font-size="11.5" fill="#4a4a4a" text-anchor="start" font-weight="normal">pulls it down: without it the FET may half-conduct.</text>
<text x="670" y="979" font-size="12" fill="#5f6b73" text-anchor="start" font-weight="normal">&#8226;</text>
<text x="686" y="979" font-size="11.5" fill="#4a4a4a" text-anchor="start" font-weight="normal">The pack feeds the 5 V pin directly, so keep it at</text>
<text x="686" y="994" font-size="11.5" fill="#4a4a4a" text-anchor="start" font-weight="normal">4.8-5.2 V. With 6&#215;AA (9 V) feed VIN instead.</text>
<text x="60" y="1050" font-size="11" fill="#8a8a8a" text-anchor="start" font-weight="normal">Values are starting points: R1 100 k, R2 and R3 10 k, Q2 any small NPN, Q1 any P-channel FET that turns on at 4 V of gate-source.</text>
</svg>
