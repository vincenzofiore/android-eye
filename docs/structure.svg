<text x="470" y="430" font-size="13" fill="#5f6b73" text-anchor="start" font-weight="bold" letter-spacing="1.2">WHAT IS WHERE</text>
<circle cx="479" cy="456" r="10" fill="#3d3d3d"/><text x="479" y="460.5" font-size="11.5" fill="#ffffff" text-anchor="middle" font-weight="bold">1</text>
<text x="500" y="460" font-size="12" fill="#4a4a4a" text-anchor="start" font-weight="normal">Eye: ball &#216;35 in a &#216;46 ring. The lid is a carved</text>
<text x="500" y="477" font-size="12" fill="#4a4a4a" text-anchor="start" font-weight="normal">wooden shell, closed like the mask's eyelids; open it</text>
<text x="500" y="494" font-size="12" fill="#4a4a4a" text-anchor="start" font-weight="normal">stands up as a visor.</text>
<circle cx="479" cy="520" r="10" fill="#7b2cbf"/><text x="479" y="524.5" font-size="11.5" fill="#ffffff" text-anchor="middle" font-weight="bold">2</text>
<text x="500" y="524" font-size="12" fill="#4a4a4a" text-anchor="start" font-weight="normal">PIR &#216;32 in the forehead, dome proud of the surface.</text>
<circle cx="479" cy="550" r="10" fill="#6b5a3e"/><text x="479" y="554.5" font-size="11.5" fill="#ffffff" text-anchor="middle" font-weight="bold">3</text>
<text x="500" y="554" font-size="12" fill="#4a4a4a" text-anchor="start" font-weight="normal">Half nose: a wedge screwed on the cut edge. In front view</text>
<text x="500" y="571" font-size="12" fill="#4a4a4a" text-anchor="start" font-weight="normal">it is a narrow ridge; the section shows how far it comes</text>
<text x="500" y="588" font-size="12" fill="#4a4a4a" text-anchor="start" font-weight="normal">out.</text>
<circle cx="479" cy="614" r="10" fill="#6b5a3e"/><text x="479" y="618.5" font-size="11.5" fill="#ffffff" text-anchor="middle" font-weight="bold">4</text>
<text x="500" y="618" font-size="12" fill="#4a4a4a" text-anchor="start" font-weight="normal">Pseudo mouth: a shallow recess cut in the front panel, not</text>
<text x="500" y="635" font-size="12" fill="#4a4a4a" text-anchor="start" font-weight="normal">two lips. The shadow of the slot does the work, and a</text>
<text x="500" y="652" font-size="12" fill="#4a4a4a" text-anchor="start" font-weight="normal">shadow costs nothing.</text>
<circle cx="479" cy="678" r="10" fill="#6b5a3e"/><text x="479" y="682.5" font-size="11.5" fill="#ffffff" text-anchor="middle" font-weight="bold">5</text>
<text x="500" y="682" font-size="12" fill="#4a4a4a" text-anchor="start" font-weight="normal">Ear: one silhouette cut in 18 mm plywood and screwed on</text>
<text x="500" y="699" font-size="12" fill="#4a4a4a" text-anchor="start" font-weight="normal">the edge. The concha is a shallow recess and the HC-SR04</text>
<text x="500" y="716" font-size="12" fill="#4a4a4a" text-anchor="start" font-weight="normal">sits in it, looking sideways down the flight. Position,</text>
<text x="500" y="733" font-size="12" fill="#4a4a4a" text-anchor="start" font-weight="normal">not concealment.</text>
<text x="50" y="884" font-size="12" fill="#8a8a8a" text-anchor="start" font-weight="normal">Eye centre 1500 mm above the tread of its step. From the wall the piece comes out 62 mm at the eye and 110 mm at the nose: the head is flattened, only the ball is spherical.</text>
</svg>
